server:
  port: 8081

spring:
  # 真实凭据请放在 application-local.yml（已 .gitignore）；可复制 application-local.yml.example 创建。
  profiles:
    include: local
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}   # 若 Docker 跑在本地 Windows，用 localhost
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/mall_v2?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  jackson:
    # 返回 JSON 时忽略 null 字段（member 的 password 置 null 后即不返回前端）
    default-property-inclusion: non_null
    time-zone: GMT+8
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.macro.mall.mbg.model
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 逻辑删除字段名（member/product/sku 等没有该列的表，MP 自动忽略，不影响）
      logic-delete-field: deleteStatus
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.macro.mall: debug

# 会员端 JWT 配置（与 admin 独立，secret 自行设置）
jwt:
  secret: ${JWT_SECRET:dev-only-portal-jwt-secret-please-change-32bytes-min}
  expiration: 7200          # 2 小时（秒）
  tokenHead: "Bearer "

elasticsearch:
  host: ${ES_HOST:localhost}
  port: ${ES_PORT:9200}

# 阿里云 OSS（C 端晒图上传，与 admin 共用同一桶）
oss:
  endpoint: ${OSS_ENDPOINT:https://oss-cn-beijing.aliyuncs.com}
  access-key-id: ${OSS_ACCESS_KEY_ID:}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
  bucket: ${OSS_BUCKET:}
  base-url: ${OSS_BASE_URL:}
